apiVersion: v1
kind: Secret
metadata:
  name: dsh-postgres-secret
  namespace: dsh-sandboxes
type: Opaque
stringData:
  POSTGRES_USER: dsh
  POSTGRES_PASSWORD: change-me-postgres-password
  POSTGRES_DB: dsh_manager
---
apiVersion: v1
kind: Service
metadata:
  name: dsh-postgres
  namespace: dsh-sandboxes
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: dsh-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: dsh-postgres
  namespace: dsh-sandboxes
spec:
  serviceName: dsh-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dsh-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dsh-postgres
    spec:
      automountServiceAccountToken: false
      containers:
        - name: postgres
          image: postgres:17-alpine
          ports:
            - containerPort: 5432
              name: postgres
          envFrom:
            - secretRef:
                name: dsh-postgres-secret
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
              subPath: pgdata
  volumeClaimTemplates:
    - metadata:
        name: pgdata
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
