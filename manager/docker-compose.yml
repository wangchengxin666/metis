services:
  traefik:
    image: ${TRAEFIK_IMAGE:-traefik:v3.7}
    container_name: dsh-gateway
    restart: unless-stopped
    environment:
      - DOCKER_API_VERSION=${DOCKER_API_VERSION:-1.44}
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=dsh-manager"
      - "--providers.http.endpoint=http://dsh-manager:9000/api/internal/traefik/config"
      - "--providers.http.pollInterval=2s"
      - "--entrypoints.web.address=:80"
    ports:
      - "${GATEWAY_PORT:-9000}:80"
    volumes:
      - ${DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock:ro
    networks:
      - sandbox-net

  manager:
    build:
      context: .
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.13-slim}
        NODE_IMAGE: ${NODE_IMAGE:-node:24-bookworm-slim}
        APT_MIRROR: ${APT_MIRROR:-deb.debian.org}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple/}
        NPM_REGISTRY: ${NPM_REGISTRY:-}
    image: ${MANAGER_IMAGE_REPO:-dsh-manager}:${MANAGER_IMAGE_TAG:-latest}
    container_name: dsh-manager
    init: true
    restart: unless-stopped
    expose:
      - "9000"
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://dsh:dsh-secret-password@postgres:5432/dsh_manager}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      MANAGER_WORKERS: ${MANAGER_WORKERS:-2}
      MANAGER_AUTH_MODE: ${MANAGER_AUTH_MODE:-auto}
      SECRET_KEY: ${SECRET_KEY:-auto}
      MANAGER_ADMIN_TOKEN: ${MANAGER_ADMIN_TOKEN:-}
      MANAGER_ADMIN_EMAIL: ${MANAGER_ADMIN_EMAIL:-admin@example.com}
      MANAGER_PUBLIC_URL: ${MANAGER_PUBLIC_URL:-http://localhost:9000}
      MANAGER_INTERNAL_URL: ${MANAGER_INTERNAL_URL:-http://dsh-manager:9000}
      GATEWAY_INTERNAL_URL: ${GATEWAY_INTERNAL_URL:-http://dsh-gateway}
      SANDBOX_SRC_DIR: /app/sandbox_src
    volumes:
      - manager-data:/data
      - ../plugins:/app/plugins:ro
      - ../sandbox:/app/sandbox_src:ro
      - ${DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dsh-manager.rule=PathPrefix(`/`)"
      - "traefik.http.routers.dsh-manager.entrypoints=web"
      - "traefik.http.routers.dsh-manager.priority=1"
      - "traefik.http.services.dsh-manager.loadbalancer.server.port=9000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sandbox-net

  postgres:
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    container_name: dsh-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dsh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dsh-secret-password}
      POSTGRES_DB: ${POSTGRES_DB:-dsh_manager}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dsh} -d ${POSTGRES_DB:-dsh_manager}"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - sandbox-net

  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    container_name: dsh-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - sandbox-net

volumes:
  manager-data:
    name: dsh-manager-data
  postgres-data:
    name: dsh-postgres-data
  redis-data:
    name: dsh-redis-data

networks:
  sandbox-net:
    name: dsh-manager
