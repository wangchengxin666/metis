services:
  sandbox:
    build:
      context: .
      args:
        # Match the host user so bind mounts on Linux are writable.
        WORKSPACE_UID: ${WORKSPACE_UID:-1000}
        WORKSPACE_GID: ${WORKSPACE_GID:-1000}
        NODE_VERSION: ${NODE_VERSION:-24.22.3}
        DSH_VERSION: ${DSH_VERSION:-0.2.3-alpha.2}
        INSTALL_TOOLCHAIN: ${INSTALL_TOOLCHAIN:-false}
        INSTALL_BROWSER: ${INSTALL_BROWSER:-false}
        # Override in .env when using private mirrors or internal registries.
        DOCKER_REGISTRY: ${DOCKER_REGISTRY:-docker.io/library}
        APT_MIRROR: ${APT_MIRROR:-deb.debian.org}
        NODE_MIRROR: ${NODE_MIRROR:-https://nodejs.org/dist}
        NPM_REGISTRY: ${NPM_REGISTRY:-}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple/}
    image: ${DSH_IMAGE_REPO:-dsh-sandbox}:${DSH_IMAGE_TAG:-latest}
    container_name: ${CONTAINER_NAME:-dsh-sandbox}
    init: true
    restart: unless-stopped
    environment:
      DSH_PUBLIC_URL: ${DSH_PUBLIC_URL:-http://localhost:8080/dsh/}
      TZ: ${TZ:-UTC}
    ports:
      # The only published port. Everything else is reachable only through
      # this Caddy listener, by design.
      - "${HOST_PORT:-8080}:8080"
    volumes:
      # /home/workspace is the default workdir and persistent home (projects, DSH sessions, services, Caddy routes).
      - dsh-home:/home/workspace
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:$${CADDY_PORT:-8080}/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s

volumes:
  dsh-home:
    name: ${CONTAINER_NAME:-dsh-sandbox}-home
